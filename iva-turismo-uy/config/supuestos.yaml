  justificacion: 'Escenario central: cae el decreto estacional (exoneración total)
    pero queda el piso de 9 puntos de la Ley 17.934. El turista pasa de IVA 0% a IVA
    13% (22% – 9% de devolución permanente). Precio relativo: índice 100 → 113.

    '
shock_pp_variante:
  valor: 22
  rango: null
  fuente: Ley 17.934 + Decreto 434/023
  justificacion: 'Variante: eliminación total del régimen (caen tanto el decreto estacional
    como la devolución permanente). El turista paga la tasa general del 22%. Precio
    relativo: índice 100 → 122.

    '
phi:
  valor: 0.15
  rango:
